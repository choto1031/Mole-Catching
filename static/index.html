<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>두더지 팡팡</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="app"><header><h1>두더지 팡팡 v2✦</h1><button id="mute">🔊</button></header><section id="setup"><div class="hero">나만의 캐릭터로<br><b>두더지를 잡아보세요!</b></div><div class="panel"><h3>두더지 종류 <small id="count"></small></h3><div id="moles"></div><button id="add">＋ 두더지 추가</button><h3>폭탄 이미지 <small>(선택)</small></h3><label class="upload"><input id="bomb" type="file" accept="image/png">💣 폭탄 이미지 업로드<img id="bombPreview"></label><p id="msg">투명 배경 PNG를 추천합니다. 이미지는 서버로 전송되지 않습니다.</p><button id="start" class="primary" disabled>게임 시작 ▶</button></div><div class="rank"><h2>🏆 TOP 10</h2><div id="rank1"></div></div></section><section id="game" class="hide"><div class="hud">점수 <b id="score">0</b><span id="lives">❤️❤️❤️</span>콤보 <b id="combo">0</b></div><div id="board"></div><div id="hammer">🔨</div></section><section id="result" class="hide"><div class="panel result"><small>GAME OVER</small><h2>최종 점수</h2><strong id="final">0</strong><p>내 최고 기록: <b id="best">0</b></p><div class="register"><input id="nick" maxlength="12" placeholder="닉네임 (1~12자)"><button id="save" class="primary">랭킹 등록</button></div><p id="regmsg"></p></div><div class="rank"><h2>🏆 TOP 10</h2><div id="rank2"></div></div><button id="retry" class="primary">다시하기</button><button id="change">이미지 바꾸기</button></section></main><script src="/static/app.js"></script></body></html>
