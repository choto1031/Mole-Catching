name: CD - Deploy to Windows self-hosted runner

on:
  workflow_run:
    workflows: ["CI - Build and publish Docker image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/mole-catching
  CONTAINER_NAME: dudogi
  VOLUME_NAME: dudogi-data

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull latest image
        run: docker pull "${env:IMAGE_NAME}:latest"

      - name: Replace running container
        run: |
          docker volume create ${env:VOLUME_NAME}
          $existing = docker ps -aq --filter "name=^/${env:CONTAINER_NAME}$"
          if ($existing) { docker rm -f ${env:CONTAINER_NAME} }
          docker run -d --name ${env:CONTAINER_NAME} --restart unless-stopped `
            -p 127.0.0.1:8000:8000 `
            -e DUDOGI_DB_PATH=/data/scores.db `
            -v "${env:VOLUME_NAME}:/data" `
            "${env:IMAGE_NAME}:latest"

      - name: Verify health endpoint
        run: |
          $ok = $false
          1..30 | ForEach-Object {
            try {
              $response = Invoke-WebRequest -Uri http://127.0.0.1:8000/health -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200 -and $response.Content -match 'ok') { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 2
          }
          if (-not $ok) {
            docker logs $env:CONTAINER_NAME
            throw 'Health check failed for http://127.0.0.1:8000/health'
          }
          Write-Host 'Health check passed.'
